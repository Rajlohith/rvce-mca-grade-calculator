<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {
      "@type": "Question",
      "name": "What changed in the 2026 scheme compared to 2024?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "The 2026 scheme changes the CIE marking, the credits and part of the course list. The two schemes are calculated separately, so nothing about 2024 is affected. Marking: One quiz instead of two: a single 10-mark quiz replaces the two quizzes (20 marks). Tests: still two regular tests plus one optional improvement test, best two reduced to 40. EL is 50 marks (Phase I 25 + Phase II 25), up from 40. PBL is now a 10-mark progress review inside the 50-mark Lab, not a stand-in for EL. This is identical in every semester (no Semester I vs Semesters II & III difference). Courses and credits: AI Fundamentals is a new 2-credit theory course with a 50 + 50 marks structure. Credits per semester: 19, 21, 21 and 19 (80 in total), versus 19, 23, 20 and 18 in 2024. Semester I: AI Fundamentals and Data Structures using Python are new. Object Oriented Programming using Java and the Skill Lab are no longer in this semester. Semester II: Object Oriented Programming using Java with Spring Boot moves here, Design and Analysis of Algorithms gains a lab, the Group-B elective is gone, Group-C becomes a 3-credit theory elective and the Design Thinking Lab drops from 2 credits to 1. Semester III: AI Product & Project Management is new and the Group-E elective moves here as a 4-credit theory + lab course. Semester IV: Professional Elective (MOOC) 3 credits, Major Project 10 credits and Project Internship 6 credits. The internship is done after Semester II but its credits are counted here, and there is no Technical Seminar. The non-credit Bridge Course Mathematics is not part of any calculator. Passing: the grading table, grade points and degree classes are unchanged. The 2026 floors are listed under the passing-marks question above, and the Final Grade page works with one combined SEE total per course, as in 2024."
      }
    },
    {
      "@type": "Question",
      "name": "Why are there two CGPA calculators?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "The credits in each semester differ between the 2024 scheme (19, 23, 20, 18) and the 2026 scheme (19, 21, 21, 19). CGPA weights each semester's SGPA by its credits, so one shared page would give wrong answers for one of them. The CGPA link in the header first asks which scheme you are on, then opens the matching page. Each page has its own Save Progress entry, and progress you saved on the CGPA page before the split still loads on the 2024 page."
      }
    },
    {
      "@type": "Question",
      "name": "How is CIE (Continuous Internal Evaluation) calculated?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "CIE is built differently in the 2024 and 2026 schemes. Check which scheme applies to you; the calculator uses the right structure automatically once you pick it. 2024 scheme: theory course (CIE out of 100): Quizzes (20 marks): Three quizzes worth 10 marks each; the best two are counted. Tests (40 marks): Three tests worth 50 marks each; the best two are added and scaled down to 40. Experiential Learning (EL), 40 marks: One combined EL score. 2024 scheme: theory course with an integrated lab: Semester I: Add 50 lab marks: Lab Record + Test (40) and Lab EL (10). Semesters II & III: Add a 50-mark Lab/Practical component. Semesters II & III: PBL replaces the 40-mark theory EL component. Total CIE: 150 marks. 2024 scheme: lab-only course: CIE consists only of the 50-mark lab component. 2026 scheme: theory course (CIE out of 100): Quiz (10 marks): One quiz only, counted as scored. The two-quiz, best-of-three system of the 2024 scheme is gone. Tests (40 marks): Two regular tests plus one optional improvement test, each out of 50. The best two are added (out of 100) and reduced to 40. Experiential Learning (EL), 50 marks: Phase I (25) + Phase II (25). EL is now 50 marks, up from 40. 2026 scheme: theory course with an integrated lab (CIE out of 150): The same 100 marks as above (Quiz 10 + Tests 40 + EL 50), plus a 50-mark Lab . The Lab is lab work, report, observation and analysis (30) + PBL progress review (10) + lab test (10). This applies in every semester. There is no separate Semester I / Semesters II & III split any more. 2026 scheme: AI Fundamentals (2-credit theory, CIE out of 50): Quiz: Conducted for 10 marks and scaled down to 5 . Tests: Tests of 25 marks each; the best two (50 in total) are reduced to 20 . EL (25 marks): Phase I (10) + Phase II (15). 2026 scheme: lab-only courses (CIE out of 50): Technical English (online): Modules assessment (30) + two tests of 10 marks each (20). Innovative Design Thinking Lab: Review I (10) + Review II (20) + Review III (15) + Final Report (5)."
      }
    },
    {
      "@type": "Question",
      "name": "How is SEE (Semester End Examination) structured?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Theory SEE (both schemes): Total: 100 marks . The paper covers 5 units . Each unit has two 20-mark questions . One question is answered from each pair. Theory course with an integrated lab (both schemes): Theory SEE: 100 marks . Separate lab examination: 50 marks . Total SEE: 150 marks. 2024: the lab exam includes viva + prototype/demo . 2026: the lab exam is evaluated through problem-/project-based learning activities mapped to the course outcomes, with the rubric shared along with the problem statements. Lab-only course: Design & Development: 20 marks. Presentation/Demo: 20 marks. Viva-Voce: 10 marks. Total SEE: 50 marks. 2026 scheme: courses with their own SEE: AI Fundamentals: 50 marks, covering 3 units (16 + 17 + 17). Technical English: 50 marks, conducted online. Innovative Design Thinking Lab: 50 marks: poster presentation (15), prototype demonstration (25) and viva-voce (10). NPTEL / MOOC courses: the exam is conducted by NPTEL. Important: The theory SEE structure stays the same across semesters and schemes even though the CIE breakdown changes."
      }
    },
    {
      "@type": "Question",
      "name": "Do CIE and SEE carry equal weight?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. CIE and SEE each carry 50% of the final course result. Standard theory course: 100 CIE + 100 SEE = 200 marks. Theory + integrated lab: 150 CIE + 150 SEE = 300 marks. Lab-only course: 50 CIE + 50 SEE = 100 marks. 2026 only, AI Fundamentals (2 credits): 50 CIE + 50 SEE = 100 marks. 2024: Semester I integrated lab courses include Lab EL; in Semesters II & III PBL replaces theory EL at the same weight. 2026: EL is 50 marks in every theory and integrated-lab course, and PBL sits inside the 50-mark lab component. Final percentage: (CIE + SEE) / (Maximum CIE + Maximum SEE) × 100"
      }
    },
    {
      "@type": "Question",
      "name": "What's the minimum I need to pass? Is 50% overall enough?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "No. Scoring 50% overall by itself is not sufficient. Additional minimum requirements apply: The requirements are based on Table 4.4 of the academic handbook. The exact checks depend on whether you are finalizing CIE or calculating the final grade. 2024 scheme, CIE Finalization tool: Checks the detailed CIE requirements while you are building your CIE. For theory courses: Quiz + Test ≥ 50% of 60 . Overall CIE must be ≥ 50% of 100 . 2024 scheme, Final Grade tool: CIE ≥ 50% . SEE ≥ 40% for theory courses. SEE ≥ 50% for lab/theory-lab courses. Overall aggregate ≥ 50% . 2026 scheme, minimum marks by course type: Theory (CIE 100, SEE 100): Quiz + Test ≥ 25/50, CIE ≥ 50/100, SEE ≥ 40/100, aggregate ≥ 100/200. AI Fundamentals (CIE 50, SEE 50): Quiz + Test ≥ 12.5/25, CIE ≥ 25/50, SEE ≥ 20/50, aggregate ≥ 50/100. Theory + Lab, CIE: theory Quiz + Test ≥ 20/50, theory CIE (Quiz + Test + EL) ≥ 40/100, Lab ≥ 25/50, total CIE ≥ 75/150. Theory + Lab, SEE: theory SEE ≥ 40/100, lab SEE ≥ 25/50, total SEE ≥ 75/150, aggregate ≥ 150/300. Lab-only (CIE 50, SEE 50): CIE ≥ 25/50, SEE ≥ 25/50, aggregate ≥ 50/100. 2026 scheme, projects and internship (graded directly in this tool): handbook Table 4.4 has no separate row for them, but their course category is Lab / Practice, so the practice standard applies: CIE ≥ 50%, SEE ≥ 50%, aggregate ≥ 50% . That means 50/100, 50/100 and 100/200 for the Major Project and the Project Internship, and 50% of the marks for the Minor Project (25/50 per the credit table, 50/100 per the course page). The Major Project syllabus also states that 50% CIE is a prerequisite to appear for SEE. NPTEL / MOOC courses have no numeric pass mark in the handbook; an F means re-registering and clearing the course online. A note on the 2026 theory + lab floor: handbook Table 4.4 sets 40% for the theory part of a theory + practice course, while each course's syllabus rubric repeats the line \"minimum 50% in Test & Quiz to clear CIE\". The calculator follows the handbook table and shows a heads-up when your Quiz + Test falls between the two. If you are in that range, confirm with your course faculty. Important: Missing even one required condition results in an F , regardless of the raw overall percentage. On the 2026 Final Grade page you enter one combined CIE and one combined SEE per course, as in 2024; for theory + lab courses the SEE total must be at least 75/150."
      }
    },
    {
      "@type": "Question",
      "name": "What's the difference between EL and PBL?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Both are experiential-learning components, but their marking differs between schemes. 2024 scheme: EL (Experiential Learning): a 40-mark theory component in the regular theory CIE. Semester I also has a separate 10-mark Lab EL for integrated lab courses. PBL (Project Based Learning): used instead of theory EL for theory + lab courses in Semesters II & III . Worth 40 marks , alongside a separate 50-mark Lab/Practical CIE component . 2026 scheme: EL is 50 marks in every theory and theory + lab course: Phase I (25) + Phase II (25). In AI Fundamentals it is 25 marks: Phase I (10) + Phase II (15). PBL is no longer a replacement for EL. It now appears as the 10-mark PBL progress review inside the 50-mark Lab (lab work 30 + PBL review 10 + lab test 10). This is the same in every semester, so there is no Semester I vs Semesters II & III difference. The CIE Finalization tool automatically shows the applicable components based on the scheme, course and semester."
      }
    },
    {
      "@type": "Question",
      "name": "How do marks turn into a letter grade?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "RVCE uses an absolute 10-point grading scale. Grade Points % Range O 10 90–100 A+ 9 80–89 A 8 70–79 B+ 7 60–69 B 6 55–59 C 5 50–54 F 0 0–49 In short: Your final percentage determines the letter grade, which then determines the grade points used for SGPA and CGPA."
      }
    },
    {
      "@type": "Question",
      "name": "What are W, I, X, DX and AB grades?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "These are temporary or special status grades rather than regular final grades. DX (Not eligible for SEE): Did not meet the minimum CIE requirement. Not allowed to write the SEE for that course at that stage. I (Incomplete): Met the CIE requirements. Could not attend the SEE for a valid, documented reason. Can be cleared through a makeup examination. W (Withdrawal): Course was officially dropped before the deadline. Requires the appropriate approval. X (SEE failure with eligibility): Attendance is ≥ 85% . CIE is ≥ 90% . Still failed the SEE. Eligible for a makeup examination. AB (Absent): Required CIE and attendance conditions were met. SEE was missed without prior approval. SGPA/CGPA impact: These temporary grades are excluded until they are resolved into a final letter grade."
      }
    },
    {
      "@type": "Question",
      "name": "How is SGPA calculated?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "SGPA is the credit-weighted average of grade points for one semester. SGPA = Σ(Course Credits × Grade Points) / Σ(Course Credits) Included: Courses with a final letter grade from O to F . F grades are included with 0 grade points . F still contributes its course credits. Excluded until resolved: W I X DX AB Important: An F lowers your SGPA because it contributes credits but zero grade points."
      }
    },
    {
      "@type": "Question",
      "name": "How is CGPA calculated?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "CGPA uses the same credit-weighted approach across all completed semesters. CGPA = Σ(Semester Credits × Semester SGPA) / Σ(Semester Credits) For the MCA 2024 Scheme: Semester I: 19 credits. Semester II: 23 credits. Semester III: 20 credits. Semester IV: 18 credits. Total: 80 credits. For the MCA 2026 Scheme: Semester I: 19 credits. Semester II: 21 credits. Semester III: 21 credits. Semester IV: 19 credits. Total: 80 credits. Two kinds of calculator are available: Final SGPA Calculator: Quickly blends your current CGPA and completed credits with a new SGPA. CGPA Calculator: Calculates the complete semester-by-semester CGPA. Because the credits per semester differ, there is one page for the 2024 scheme and one for the 2026 scheme."
      }
    },
    {
      "@type": "Question",
      "name": "What CGPA do I need for First Class / Distinction?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "These classifications apply only after all semesters are cleared with no pending F grades. First Class with Distinction: CGPA ≥ 7.0. First Class: CGPA ≥ 6.0 and < 7.0. Second Class: CGPA ≥ 5.0 and < 6.0. Important: The classification is subject to the applicable academic requirements in Section 4.12(d)."
      }
    },
    {
      "@type": "Question",
      "name": "Does this calculator work for Internship, Project, or NPTEL courses?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Not for CIE/SEE calculation, and you won't find cards for them on the CIE & SEE or Final Grade pages. The CIE/SEE tools are designed specifically for standard theory and lab course structures . Internships follow their own evaluation rules. Major/Minor Projects use separate evaluation processes involving components such as: Guide evaluation. External panel evaluation. Viva-voce. NPTEL courses are conducted and evaluated through their online system. In the 2026 scheme this covers Research Methodology (NPTEL), the Professional Elective (MOOC), Minor Project, Major Project and the Project Internship. The Technical Seminar belongs to the 2024 scheme only; it does not exist in 2026. Since none of these follow the CIE quiz/test/EL/lab structure, a card for them on the CIE & SEE or Final Grade Calculator would never actually do anything, so they're left out of those two pages' course lists entirely, to keep the grid focused on courses you can actually calculate there. However: Once you receive the final letter grade for one of these courses, you can enter it directly into the SGPA/CGPA calculators, they're still counted normally there."
      }
    },
    {
      "@type": "Question",
      "name": "Why are the courses on the CIE & SEE and Final Grade pages split into Theory + Lab, Theory Only, and Lab Only groups?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Each course type needs a different set of input fields: a Theory + Lab course has quizzes, tests, EL, and a lab component, while a Lab Only course has just the lab fields. Mixed together in one grid, cards of very different heights left uneven, gappy rows. Grouping courses by type keeps cards of similar height and shape next to each other, so the grid lines up cleanly. The grouping is purely visual; it doesn't change how any course is calculated. In the 2026 scheme, AI Fundamentals sits under Theory Only with its own 50-mark layout, and Technical English and the Design Thinking Lab sit under Lab Only with their own fields."
      }
    },
    {
      "@type": "Question",
      "name": "Why can't I add a custom or manual course?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "This is intentional. Course lists are based on the official 2024 and 2026 scheme syllabi . Only courses actually offered in the selected scheme and semester can be selected. Credit values are tied to the official course structure. This prevents users from accidentally entering incorrect courses or credits. It also keeps the calculator's results consistent with the RVCE grading structure. The non-credit Bridge Course Mathematics is deliberately not included: it carries no credits and does not count towards SGPA or CGPA. If something is incorrect: Check the official syllabus first. If the course or credit value is genuinely missing or incorrect, open an issue on the GitHub repository. A manual course should not be added simply to force a calculation."
      }
    },
    {
      "@type": "Question",
      "name": "How does the Scheme → Semester navigation work?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "The navigation follows the structure of the MCA program. Select a Scheme The scheme determines the applicable course list. It also determines the credit structure, CIE marking and passing rules. The scheme remains applicable throughout your four-semester program. Select a Semester Year 1: Semesters I & II. Year 2: Semesters III & IV. \"Year 1\" and \"Year 2\" are only navigation labels. They are not additional academic steps. Use the available tools CIE Calculator. SEE / Final Grade Calculator. Final SGPA Calculator. The CGPA Calculator is reached from the CGPA link in the header. It asks for your scheme first, then opens the 2024 or 2026 CGPA page. Current scheme availability: 2024 Scheme: Active. 2026 Scheme: Active."
      }
    },
    {
      "@type": "Question",
      "name": "Is this an official RVCE tool?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "No. This is an independent, unofficial tool . It was created by a student for students. The calculations are based on information from: RVCE PG Academic Handbook (2024–25 and 2026–27). MCA 2024 Scheme syllabus. MCA 2026 Scheme syllabus. Applicable academic rules and grading tables. For important academic decisions: Always verify your final result against your official grade card . For clarification or disputes, contact the RVCE Controller of Examinations . This calculator should be treated as a convenience tool, not an official academic record."
      }
    }
  ]
}
