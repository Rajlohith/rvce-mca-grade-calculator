<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>(function(){try{var t=localStorage.getItem('mca-theme');if(t==='dark'){document.documentElement.setAttribute('data-theme','dark');}}catch(e){}})();</script>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-qlmtBACaL5yO2przW9aRA79fJYme7UqSjVFLsmIlb/8='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CIE &amp; SEE Calculator - RVCE MCA Grade Calculator</title>
<meta name="description" content="Finalize your CIE and find the SEE marks needed for every grade, for every course in an RVCE MCA semester at once.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/layout.css">
<link rel="stylesheet" href="../css/components.css">
</head>
<body>
<header id="site-header" class="site-header"></header>

<div class="wrap">
  <div class="page-hero">
    <div class="eyebrow" id="toolEyebrow">Semester</div>
    <h1>CIE Finalization &amp; SEE Marks Required</h1>
    <p>Every course in this semester is right here, fill in what you've got, calculate, and check what SEE score each grade needs.</p>
  </div>

  <div id="breadcrumb"></div>

  <main id="app">
    <div class="course-grid" id="courseGrid"></div>

    <div class="toolbar" style="margin-top:22px;">
      <button type="button" class="btn ghost full" id="resetAllBtn">Reset All Marks</button>
    </div>

    <div id="gradeScaleStrip" style="margin-top:20px;"></div>
  </main>

  <footer id="site-footer" class="site-footer"></footer>
</div>

<!-- Shared SEE Requirements modal, populated per course on demand -->
<div class="modal-overlay hidden" id="seeModalOverlay">
  <div class="modal" id="seeModal">
    <button type="button" class="modal-close" id="seeModalClose" aria-label="Close">&times;</button>
    <h3>SEE Requirements</h3>
    <div class="modal-row">Subject: <b id="seeModalSubject"></b></div>
    <div class="modal-row">CIE Score: <b id="seeModalCie"></b></div>
    <div class="modal-see-of" id="seeModalSeeOf"></div>
    <div id="seeModalLabBox"></div>
    <div id="seeModalRows"></div>
    <button type="button" class="btn amber full" id="copyAllBtn">Copy All Requirements</button>
  </div>
</div>

<script src="../js/util.js"></script>
<script src="../js/data.js"></script>
<script src="../js/icons.js"></script>
<script src="../js/grading.js"></script>
<script src="../js/engine.js"></script>
<script src="../js/course-picker.js"></script>
<script src="../js/input-guard.js"></script>
<script src="../js/site.js"></script>
<script src="../js/pages/cie-see.js"></script>
</body>
</html>
