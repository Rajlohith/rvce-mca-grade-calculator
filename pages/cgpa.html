<div id="mca-splash" aria-hidden="true"><div class="mca-splash-mark"><img src="../icons/icon-192.png" width="96" height="96" alt="RVCE MCA Grade Calculator logo"></div><div class="mca-splash-name">RVCE MCA Grade Calculator</div><div class="mca-splash-dots"><span></span><span></span><span></span></div></div>
<script>(function(){try{var standalone=window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;var seen=sessionStorage.getItem('mca-splash-seen');if(standalone&&!seen){document.documentElement.classList.add('mca-splash-active');sessionStorage.setItem('mca-splash-seen','1');}else{var el=document.getElementById('mca-splash');if(el)el.remove();}}catch(e){var el=document.getElementById('mca-splash');if(el)el.remove();}})();</script>
<header id="site-header" class="site-header"></header>

<div class="wrap">
  <div class="page-hero">
    <h1>CGPA Calculator</h1>
    <p>Enter your SGPA grades and end up predicting your Final CGPA.</p>
  </div>

  <div id="breadcrumb"></div>

  <main id="app">
    <div class="card">
      <div class="section-head">
        <h2 id="cgpaPageIcon" style="font-size:17px;display:flex;align-items:center;gap:12px;"><span class="icon-badge soft green" style="width:38px;height:38px;" id="cgpaIconBadge"></span>All Semesters</h2>
      </div>
      <table class="ledger" id="cgTable">
        <thead><tr><th class="check-col">Done</th><th>Semester</th><th>Credits</th><th>SGPA</th></tr></thead>
        <tbody></tbody>
      </table>

      <div class="result" id="cgResult"></div>
      <div class="toolbar" style="margin-top:16px; display:flex; gap:10px;">
        <button type="button" class="btn accent full" id="saveProgressBtn">Save Progress</button>
        <button type="button" class="btn ghost full" id="resetAllBtn">Reset All</button>
      </div>

      <hr class="rule">
      <div class="bj-head">
        <span class="icon-badge soft blue" style="width:38px;height:38px;" id="bjIconBadge"></span>
        <h2 style="font-size:17px;margin:0;">Beat Yourself</h2>
      </div>
      <div class="bj-target-row field-row-2">
        <div class="field">
          <label for="bjTargetSem">Target by semester</label>
          <select id="bjTargetSem"></select>
        </div>
        <div class="field">
          <label for="bjTargetVal">Target CGPA</label>
          <input type="number" id="bjTargetVal" min="0" max="10" step="0.01" placeholder="0.00">
        </div>
      </div>
      <div id="bjSummary"></div>
      <div id="beatJourney"></div>
    </div>
  </main>

  <footer id="site-footer" class="site-footer"></footer>
</div>
