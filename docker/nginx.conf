server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers (mirrors what firebase.json was setting)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

    # Custom 404 page
    error_page 404 /404.html;

    # Cache JS/CSS aggressively (they're versioned via ?v= query strings)
    location ~* \.(js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Cache images/fonts for a week
    location ~* \.(png|jpg|jpeg|svg|ico|webmanifest)$ {
        add_header Cache-Control "public, max-age=604800, must-revalidate";
    }

    # Don't cache HTML (so deploys show up immediately)
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # sw.js must never be cached, and needs this header for its scope
    location = /sw.js {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Service-Worker-Allowed "/";
    }

    # Clean URLs: /guide -> /pages/guide.html (mirrors firebase.json's cleanUrls)
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}